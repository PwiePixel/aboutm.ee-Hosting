# Alles, was auf dem Server läuft:
#   web    – die Website mit Verwaltung; startet die Minecraft-Container
#   router – nimmt Minecraft-Verbindungen auf Port 25565 an und leitet sie
#            anhand der Adresse (mc-xxxx.<SERVER_DOMAIN>) an die richtige Welt
#   tunnel – Cloudflare-Tunnel: bringt die Website ins Netz, ohne dass Port 80/443 offen sein muss
#   caddy  – Alternative zum Tunnel: HTTPS direkt über diesen Server
# Welcher der beiden läuft, bestimmt COMPOSE_PROFILES in .env (tunnel oder caddy).
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      RUNTIME_DRIVER: docker
      # Derselbe Pfad innen und außen — die Minecraft-Container hängen ihn vom Host ein.
      DATA_DIR: ${DATA_PATH:-/srv/aboutmee/data}
      HOST_DATA_DIR: ${DATA_PATH:-/srv/aboutmee/data}
      MC_NETWORK: aboutmee-mc
    volumes:
      - ${DATA_PATH:-/srv/aboutmee/data}:${DATA_PATH:-/srv/aboutmee/data}
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [web]

  router:
    image: itzg/mc-router:latest
    restart: unless-stopped
    # Braucht Lesezugriff auf den Docker-Socket, um laufende Welten zu finden.
    user: "0:0"
    environment:
      IN_DOCKER: "true"
      DOCKER_NETWORK: aboutmee-mc
      CONNECTION_RATE_LIMIT: "20"
    ports:
      - "25565:25565"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [mc]

  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks: [web]

  caddy:
    profiles: [caddy]
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

networks:
  web:
  mc:
    name: aboutmee-mc

volumes:
  caddy_data:
  caddy_config:
